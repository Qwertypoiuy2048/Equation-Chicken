<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equation Chicken · Your Turn</title>
  <link rel="stylesheet" href="styles.css">
  <script src="equation.js" defer></script>
  <script src="game-state.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Two-player graphing game</div>
        <h1>Equation Chicken</h1>
      </div>
      <div class="scoreboard" aria-label="Current score">
        <div><span class="eyebrow">Player 1</span><strong data-score-player="1">0</strong></div>
        <div><span class="eyebrow">Player 2</span><strong data-score-player="2">0</strong></div>
      </div>
    </header>

    <nav class="page-nav" aria-label="Game pages">
      <a class="page-link active" href="index.html" aria-current="page">Turn</a>
      <a class="page-link" href="challenge.html">Challenge</a>
      <a class="page-link" href="result.html">Result</a>
    </nav>

    <main>
      <section class="panel">
        <div class="turn-header">
          <div><div class="eyebrow">Match <span data-match-number>1</span></div><h2><span data-current-player-name>Player 1</span>'s turn</h2></div>
          <div class="eyebrow">Removals remaining: P1 2 · P2 1</div>
        </div>
        <div class="meta"><span>Valid graphable equation</span><span>One action per turn</span></div>
        <div class="equation" aria-label="Current equation" data-equation>y = x</div>
        <section id="edit-actions" class="equation-editor-panel" hidden>
          <label class="equation-editor-label" for="equation-editor">Edit equation</label>
          <input id="equation-editor" class="equation-editor" type="text" value="y = x" aria-describedby="equation-message" autocomplete="off">
          <div id="equation-preview" class="equation-preview" aria-label="Equation token preview"></div>
          <p id="equation-message" class="equation-message" role="status" aria-live="polite"></p>
          <div class="actions"><button class="action primary" type="button" data-action="verify-equation">Verify</button><button class="action" type="button" data-action="accept-equation" disabled>Accept</button><button class="action" type="button" data-action="revert-equation">Revert</button></div>
        </section>
        <p class="banned"><strong>Banned this match:</strong> 4, ^</p>
        <div id="turn-actions" class="actions"><button class="action" type="button" data-action="start-edit">Alter equation</button><a class="action primary" href="challenge.html" data-action="start-challenge">Challenge the other player</a></div>
        <p class="history"><strong>Equation history:</strong> <span data-equation-history>y = x</span></p>
      </section>
    </main>
  </div>
</body>
</html>
