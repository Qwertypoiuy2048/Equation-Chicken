<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equation Chicken · Result</title>
  <link rel="stylesheet" href="styles.css">
  <script src="equation.js" defer></script>
  <script src="game-state.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Two-player graphing game</div>
        <h1>Equation Chicken</h1>
      </div>
      <div class="scoreboard" aria-label="Current score">
        <div><span class="eyebrow">Player 1</span><strong data-score-player="1">0</strong></div>
        <div><span class="eyebrow">Player 2</span><strong data-score-player="2">0</strong></div>
      </div>
    </header>

    <nav class="page-nav" aria-label="Game pages">
      <a class="page-link" href="index.html">Turn</a>
      <a class="page-link" href="challenge.html">Challenge</a>
      <a class="page-link active" href="result.html" aria-current="page">Result</a>
    </nav>

    <main>
      <section id="final-judgment" class="panel result" hidden>
        <div class="eyebrow">Final judgment</div>
        <h2>Both players have drawn.</h2>
        <p>Choose which player was right, or mark both drawings as incorrect.</p>
        <div class="graph-wrap">
          <div id="final-graph" class="graph" role="img" aria-label="Comparison of both player drawings and the computer reference graph">
            <span class="axis-x"></span><span class="axis-y"></span>
            <span class="axis-label x">x</span><span class="axis-label y">y</span>
            <canvas id="final-reference-canvas" class="reference-canvas" aria-label="Computer reference graph"></canvas>
            <canvas id="final-drawing-canvas" class="final-drawing-canvas" aria-label="Both player drawings"></canvas>
          </div>
        </div>
        <div class="result-actions">
          <button class="action primary" type="button" data-action="award-player" data-winner="1">Player 1 was right</button>
          <button class="action primary" type="button" data-action="award-player" data-winner="2">Player 2 was right</button>
          <button class="action" type="button" data-action="resolve-draw">Both failed</button>
        </div>
      </section>

      <section id="match-result" class="panel result">
        <div class="eyebrow">Match result</div>
        <h2 data-result-title><span data-winner-name>Player 1</span> wins!</h2>
        <p data-result-detail>Player 1 <strong data-score-player="1">0</strong> · Player 2 <strong data-score-player="2">0</strong></p>
        <p class="hint">Next starting player: <span data-next-player-name>Player 1</span></p>
        <div class="result-actions"><a class="action primary" href="index.html" data-action="next-match">Next match</a></div>
      </section>
    </main>
  </div>
</body>
</html>
